<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --blue: #004a99; --dark: #1a202c; --border: #e2e8f0; }
        body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; background: #fff; color: var(--dark); }
        
        .widget-box { border: 1px solid var(--border); border-radius: 4px; padding: 16px; }
        .header { font-size: 14px; font-weight: 700; color: var(--blue); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .field { margin-bottom: 12px; }
        label { display: block; font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
        
        select, input { 
            width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--border); 
            border-radius: 4px; font-size: 13px; outline: none; transition: border-color 0.2s;
        }
        select:focus, input:focus { border-color: var(--blue); }

        .info-panel { background: #f8fafc; border-radius: 4px; padding: 12px; margin-top: 16px; border-left: 3px solid var(--blue); }
        .info-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid #e2e8f0; }
        .total-price { font-size: 18px; font-weight: 700; color: var(--blue); }

        .btn-submit { 
            background: var(--blue); color: white; border: none; width: 100%; height: 40px; 
            border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 12px; font-size: 13px;
        }
        .btn-submit:hover { background: #003366; }
    </style>
</head>
<body>
<div class="widget-box">
    <div class="header">Параметры изделия</div>
    
    <div class="field">
        <label>Тип продукции</label>
        <select id="prod" onchange="calc()">
            <option value="" data-p="0" data-w="0" data-u="ед.">-- Выберите из списка --</option>
            <option value="1" data-p="285" data-w="2.51" data-u="карта">Сетка сварная (2.51 кг/к)</option>
            <option value="2" data-p="450" data-w="4.35" data-u="карта">Сетка сварная (4.35 кг/к)</option>
            <option value="3" data-p="1200" data-w="11.75" data-u="карта">Сетка сварная (11.75 кг/к)</option>
            <option value="4" data-p="115" data-w="0.138" data-u="шт">Болт М16х60 ГОСТ</option>
            <option value="5" data-p="180" data-w="0.512" data-u="шт">Болт М24х100 ГОСТ</option>
            <option value="6" data-p="55" data-w="0.034" data-u="шт">Гайка М16 ГОСТ</option>
            <option value="7" data-p="110" data-w="0.110" data-u="шт">Гайка М24 ГОСТ</option>
            <option value="8" data-p="520" data-w="0.528" data-u="метр">Канат 12.0-Г-В-Л-О</option>
        </select>
    </div>

    <div class="field">
        <label id="qLabel">Количество</label>
        <input type="number" id="qty" value="1" min="1" oninput="calc()">
    </div>

    <div class="info-panel">
        <div class="info-row"><span>Вес ед.:</span> <b id="wU">0.00</b> кг</div>
        <div class="info-row"><span>Общий вес:</span> <b id="wT">0.00</b> кг</div>
        <div class="total-row">
            <span>ИТОГО:</span>
            <span class="total-price"><span id="pT">0</span> ₽</span>
        </div>
    </div>

    <button class="btn-submit" onclick="send()">ДОБАВИТЬ В РАСЧЕТ</button>
</div>

<script>
    function calc() {
        const o = document.getElementById('prod').selectedOptions[0];
        const q = parseFloat(document.getElementById('qty').value) || 0;
        document.getElementById('qLabel').innerText = "Количество (" + o.dataset.u + ")";
        document.getElementById('wU').innerText = parseFloat(o.dataset.w).toFixed(3);
        document.getElementById('wT').innerText = (o.dataset.w * q).toFixed(3);
        document.getElementById('pT').innerText = (o.dataset.p * q).toLocaleString();
    }
    function send() {
        const o = document.getElementById('prod').selectedOptions[0];
        if(!o.value) return;
        window.parent.postMessage({ 
            type: 'ADD', 
            name: o.text, 
            qty: document.getElementById('qty').value, 
            unit: o.dataset.u,
            price: parseInt(document.getElementById('pT').innerText.replace(/\s/g, '')) 
        }, '*');
    }
    window.addEventListener('message', e => {
        if(e.data.type === 'SEL') {
            const s = document.getElementById('prod');
            for(let i=0; i<s.options.length; i++) {
                if(s.options[i].text.includes(e.data.name)) { s.selectedIndex = i; calc(); break; }
            }
        }
    });
</script>
</body>
</html>
