<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --blue: #004a99; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 10px; background: #fff; overflow: hidden; }
        .widget-box { border: 1px solid var(--border); border-radius: 4px; padding: 15px; position: relative; }
        .header { font-size: 13px; font-weight: 700; color: var(--blue); margin-bottom: 12px; text-transform: uppercase; }
        
        .search-container { position: relative; margin-bottom: 15px; }
        label { display: block; font-size: 10px; font-weight: 700; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
        
        .search-input { 
            width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--border); 
            border-radius: 4px; font-size: 13px; box-sizing: border-box;
        }
        
        /* Выпадающий список подсказок */
        .suggestions {
            position: absolute; width: 100%; background: #fff; border: 1px solid var(--border);
            border-top: none; z-index: 100; max-height: 180px; overflow-y: auto; display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .suggestion-item { padding: 10px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
        .suggestion-item:hover { background: #f8fafc; color: var(--blue); }

        .info-panel { background: #f8fafc; border-radius: 4px; padding: 12px; border-left: 3px solid var(--blue); }
        .info-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
        .total-price { font-size: 20px; font-weight: 800; color: var(--blue); text-align: right; margin-top: 8px; }

        .btn-add { 
            background: var(--blue); color: white; border: none; width: 100%; height: 40px; 
            border-radius: 4px; font-weight: 700; cursor: pointer; margin-top: 12px; font-size: 12px;
        }
    </style>
</head>
<body>
<div class="widget-box">
    <div class="header">Конфигуратор метизов</div>
    
    <div class="search-container">
        <label>Поиск по названию или ГОСТ</label>
        <input type="text" id="searchInput" class="search-input" placeholder="Напр: 23279 или Сетка..." oninput="showSuggestions(this.value)">
        <div id="suggestions" class="suggestions"></div>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <div style="flex: 1;">
            <label id="unitLabel">Кол-во</label>
            <input type="number" id="qty" class="search-input" value="1" min="1" oninput="calculate()">
        </div>
    </div>

    <div class="info-panel">
        <div class="info-row"><span>Вес ед.:</span> <b id="wUnit">0.000</b> кг</div>
        <div class="info-row"><span>Общий вес:</span> <b id="wTotal">0.000</b> кг</div>
        <div class="total-price"><span id="pTotal">0</span> ₽</div>
    </div>

    <button class="btn-add" onclick="sendToSite()">ДОБАВИТЬ В РАСЧЕТ</button>
</div>

<script>
    // РЕАЛЬНАЯ БАЗА ДАННЫХ (из твоего скриншота)
    const products = [
        { name: "Сетка сварная ГОСТ 23279", weight: 2.510, price: 285, unit: "карта" },
        { name: "Сетка сварная тяжелая ГОСТ 23279", weight: 4.350, price: 450, unit: "карта" },
        { name: "Проволока 3.0 ВР-1 ГОСТ 6727", weight: 0.052, price: 85, unit: "метр" },
        { name: "Проволока 4.0 ВР-1 ГОСТ 6727", weight: 0.092, price: 110, unit: "метр" },
        { name: "Болт М16х60 ГОСТ 22353", weight: 0.138, price: 115, unit: "шт" },
        { name: "Болт М24х100 ГОСТ 22353", weight: 0.512, price: 180, unit: "шт" },
        { name: "Гайка М16 ГОСТ 5915", weight: 0.034, price: 55, unit: "шт" },
        { name: "Гайка М24 ГОСТ 5915", weight: 0.110, price: 110, unit: "шт" },
        { name: "Канат 12.0-Г-В-Л-О ГОСТ 2688", weight: 0.528, price: 520, unit: "метр" }
    ];

    let selectedProduct = null;

    function showSuggestions(val) {
        const container = document.getElementById('suggestions');
        container.innerHTML = '';
        if (val.length < 1) { container.style.display = 'none'; return; }

        const filtered = products.filter(p => p.name.toLowerCase().includes(val.toLowerCase()));
        
        if (filtered.length > 0) {
            filtered.forEach(p => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerText = p.name;
                div.onclick = () => selectProduct(p);
                container.appendChild(div);
            });
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
        }
    }

    function selectProduct(p) {
        selectedProduct = p;
        document.getElementById('searchInput').value = p.name;
        document.getElementById('suggestions').style.display = 'none';
        calculate();
    }

    function calculate() {
        if (!selectedProduct) return;
        const q = parseFloat(document.getElementById('qty').value) || 0;
        document.getElementById('unitLabel').innerText = "Кол-во (" + selectedProduct.unit + ")";
        document.getElementById('wUnit').innerText = selectedProduct.weight.toFixed(3);
        document.getElementById('wTotal').innerText = (selectedProduct.weight * q).toFixed(3);
        document.getElementById('pTotal').innerText = (selectedProduct.price * q).toLocaleString();
    }

    function sendToSite() {
        if (!selectedProduct) return;
        window.parent.postMessage({ 
            type: 'ADD', 
            name: selectedProduct.name, 
            qty: document.getElementById('qty').value, 
            price: parseInt(document.getElementById('pTotal').innerText.replace(/\s/g, '')) 
        }, '*');
    }

    // Слушатель для выбора из каталога
    window.addEventListener('message', e => {
        if(e.data.type === 'SEL') {
            const p = products.find(prod => prod.name.includes(e.data.name));
            if(p) selectProduct(p);
        }
    });
</script>
</body>
</html>
