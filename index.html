<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ООО СТРОЙТЕХИНВЕСТ | Панель управления</title>
    <style>
        :root { --blue: #004a99; --border: #cbd5e1; }
        body { font-family: sans-serif; background: #f1f5f9; margin: 0; }
        header { background: #fff; border-bottom: 1px solid var(--border); padding: 15px 5%; font-weight: 800; color: var(--blue); }
        .container { display: grid; grid-template-columns: 1fr 350px; gap: 20px; padding: 20px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .card { background: #fff; padding: 15px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; }
        .card h4 { margin: 0 0 5px; font-size: 12px; color: var(--blue); }
        .card p { font-size: 10px; color: #64748b; margin-bottom: 10px; }
        .btn-pick { width: 100%; padding: 8px; border: 1px solid var(--blue); background: #fff; color: var(--blue); font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        iframe { width: 100%; height: 800px; border: 1px solid var(--border); background: #fff; }
    </style>
</head>
<body>
    <header>СТРОЙТЕХИНВЕСТ</header>
    <div class="container">
        <main id="catalog" class="grid">Загрузка...</main>
        <aside>
            <iframe id="calcFrame" src="widget.html"></iframe>
        </aside>
    </div>

    <script>
        const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSYKUmtE5Idl6Jb5Le2Xrus-AV-9gdcDPHckyejXN4WKrfdR7qsMQmdv7mDoxXYVfwdFKQfBBTBeLsa/pub?output=csv';
        async function load() {
            const res = await fetch(CSV);
            const text = await res.text();
            const rows = text.split('\n').slice(1);
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';
            rows.forEach((row, index) => {
                const cols = row.split(',');
                if (cols[1]) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `<div><h4>${cols[1]}</h4><p>Вес: ${cols[2]} кг/${cols[3]}</p></div>
                                     <button class="btn-pick" onclick="pick(${index})">Выбрать</button>`;
                    catalog.appendChild(card);
                }
            });
        }
        function pick(idx) {
            document.getElementById('calcFrame').contentWindow.postMessage({ type: 'SET_IDX', idx: idx }, '*');
        }
        load();
    </script>
</body>
</html>
