<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ООО СТРОЙТЕХИНВЕСТ | Панель управления</title>
    <style>
        :root { --blue: #004a99; --text: #1e293b; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: var(--text); }
        header { background: #fff; border-bottom: 2px solid var(--blue); padding: 15px 5%; display: flex; justify-content: space-between; }
        .container { display: grid; grid-template-columns: 1fr 380px; gap: 30px; padding: 30px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .card { background: #fff; padding: 20px; border: 1px solid #e2e8f0; border-radius: 4px; }
        .btn-sel { width: 100%; padding: 10px; border: 1px solid var(--blue); background: none; color: var(--blue); cursor: pointer; font-weight: 600; margin-top: 15px; }
        .btn-sel:hover { background: var(--blue); color: #fff; }
        iframe { width: 100%; height: 420px; border: none; }
    </style>
</head>
<body>
    <header><b style="color:var(--blue)">СТРОЙТЕХИНВЕСТ</b> <span>Модуль конфигурации ГОСТ</span></header>
    <div class="container">
        <main>
            <h2 style="font-size:18px;">Каталог продукции (ГОСТ)</h2>
            <div class="grid">
                <div class="card">
                    <h4>Сетка ГОСТ 23279</h4>
                    <p>Вес: 2.510 кг/карта. Арматурная, тип 1.</p>
                    <button class="btn-sel" onclick="pick('Сетка сварная ГОСТ 23279')">ВЫБРАТЬ</button>
                </div>
                <div class="card">
                    <h4>Болт ГОСТ 22353</h4>
                    <p>М16х60. Высокопрочный крепеж 10.9.</p>
                    <button class="btn-sel" onclick="pick('Болт М16х60 ГОСТ 22353')">ВЫБРАТЬ</button>
                </div>
                <div class="card">
                    <h4>Канат ГОСТ 2688</h4>
                    <p>12.0-Г-В-Л-О. Стальной трос общего назначения.</p>
                    <button class="btn-sel" onclick="pick('Канат 12.0-Г-В-Л-О ГОСТ 2688')">ВЫБРАТЬ</button>
                </div>
            </div>
        </main>
        <aside>
            <iframe id="widg" src="widget.html"></iframe>
            <div id="res" style="background:#fff; padding:20px; border:1px solid #e2e8f0; margin-top:20px;">
                <b style="font-size:12px; color:#64748b;">ИТОГО К ЗАКАЗУ:</b>
                <div id="items" style="font-size:13px; margin:15px 0;"></div>
                <div style="font-size:24px; font-weight:800; color:var(--blue);"><span id="total">0</span> ₽</div>
            </div>
        </aside>
    </div>
    <script>
        let sum = 0;
        function pick(n) { document.getElementById('widg').contentWindow.postMessage({type:'SEL', name:n}, '*'); }
        window.addEventListener('message', e => {
            if(e.data.type === 'ADD') {
                document.getElementById('items').innerHTML += `<div style="margin-bottom:8px;">${e.data.name} (x${e.data.qty}) — <b>${e.data.price.toLocaleString()} ₽</b></div>`;
                sum += e.data.price;
                document.getElementById('total').innerText = sum.toLocaleString();
            }
        });
    </script>
</body>
</html>
