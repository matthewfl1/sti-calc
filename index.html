<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ООО СТРОЙТЕХИНВЕСТ | Система управления</title>
    <style>
        :root { --blue: #004a99; --text: #1e293b; --bg: #f8fafc; --border: #cbd5e1; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #f1f5f9; margin: 0; color: var(--text); }
        header { background: #fff; border-bottom: 1px solid var(--border); padding: 12px 5%; display: flex; align-items: center; }
        .logo { font-size: 18px; font-weight: 800; color: var(--blue); }
        .container { display: grid; grid-template-columns: 1fr 380px; gap: 24px; padding: 20px 5%; max-width: 1400px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        .card { background: #fff; padding: 15px; border: 1px solid var(--border); border-radius: 2px; display: flex; flex-direction: column; justify-content: space-between; }
        .card h4 { margin: 0 0 8px; font-size: 13px; color: var(--blue); text-transform: uppercase; }
        .card p { font-size: 11px; color: #64748b; margin: 0 0 12px; line-height: 1.4; }
        .btn-pick { width: 100%; padding: 8px; background: #fff; border: 1px solid var(--blue); color: var(--blue); font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .btn-pick:hover { background: var(--blue); color: #fff; }
        iframe { width: 100%; height: 420px; border: 1px solid var(--border); background: #fff; margin-bottom: 15px; }
        .summary { background: #fff; border: 1px solid var(--border); padding: 18px; }
        .order-item { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; align-items: center; }
        .total-block { margin-top: 15px; padding-top: 10px; border-top: 2px solid var(--blue); }
        .price-val { font-size: 22px; font-weight: 800; color: var(--blue); text-align: right; }
        .info-text { font-size: 10px; color: #94a3b8; margin-top: 8px; line-height: 1.3; }
        .delivery-info { background: #eff6ff; padding: 10px; margin-top: 10px; font-size: 11px; border: 1px solid #bfdbfe; }
    </style>
</head>
<body>
    <header><div class="logo">СТРОЙТЕХИНВЕСТ</div></header>

    <div class="container">
        <main>
            <div id="catalog" class="grid">Загрузка каталога...</div>
        </main>

        <aside>
            <iframe id="calcFrame" src="widget.html"></iframe>
            
            <div class="summary">
                <div style="font-size: 10px; font-weight: 800; color: #64748b; margin-bottom: 10px; text-transform: uppercase;">Спецификация заказа</div>
                <div id="orderList"></div>
                
                <div class="total-block">
                    <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px;">
                        <span>Общий вес:</span> <b id="totalW">0</b> кг
                    </div>
                    <div class="price-val"><span id="totalSum">0</span> ₽*</div>
                    
                    <div id="transport" class="delivery-info">Транспорт: не определен</div>
                    
                    <div class="info-text">
                        * Цена на некоторые товары может меняться в зависимости от объема и логистики. Для уточнения точной стоимости рекомендуем обратиться к сотруднику.
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSYKUmtE5Idl6Jb5Le2Xrus-AV-9gdcDPHckyejXN4WKrfdR7qsMQmdv7mDoxXYVfwdFKQfBBTBeLsa/pub?output=csv';
        let totalSum = 0;
        let totalWeight = 0;

        async function loadCatalog() {
            try {
                const res = await fetch(CSV);
                const text = await res.text();
                const rows = text.split('\n').slice(1);
                const catalog = document.getElementById('catalog');
                catalog.innerHTML = '';
                rows.forEach((row, index) => {
                    const cols = row.split(',');
                    if (cols[1]) {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `<div><h4>${cols[1]}</h4><p>Вес: ${cols[2]} кг/${cols[3]}</p></div>
                                         <button class="btn-pick" onclick="pick(${index})">Выбрать</button>`;
                        catalog.appendChild(card);
                    }
                });
            } catch(e) { console.error("Error loading CSV"); }
        }

        function pick(idx) {
            document.getElementById('calcFrame').contentWindow.postMessage({ type: 'SET_IDX', idx: idx }, '*');
        }

        window.addEventListener('message', e => {
            if (e.data.type === 'ADDED') {
                const item = document.createElement('div');
                item.className = 'order-item';
                item.innerHTML = `<span>${e.data.name}</span><b>${e.data.price.toLocaleString()} ₽</b>`;
                document.getElementById('orderList').appendChild(item);
                
                totalSum += e.data.price;
                totalWeight += e.data.weight;
                
                document.getElementById('totalSum').innerText = totalSum.toLocaleString();
                document.getElementById('totalW').innerText = totalWeight.toFixed(2);
                
                updateTransport(totalWeight);
            }
        });

        function updateTransport(w) {
            let t = "";
            if (w <= 0) t = "не определен";
            else if (w <= 1500) t = "Рекомендуемый транспорт: Газель (до 1.5т)";
            else if (w <= 5000) t = "Рекомендуемый транспорт: Валдай / Газон (до 5т)";
            else if (w <= 20000) t = "Рекомендуемый транспорт: Фура (до 20т)";
            else t = "Требуется несколько машин";
            document.getElementById('transport').innerText = t;
        }

        loadCatalog();
    </script>
</body>
</html>
