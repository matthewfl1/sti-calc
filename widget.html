<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --blue: #004a99; --border: #cbd5e1; --bg: #f8fafc; }
        body { font-family: sans-serif; margin: 0; padding: 12px; background: #fff; border: 1px solid var(--border); }
        .label { display: block; font-size: 10px; font-weight: 700; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
        .input-group { margin-bottom: 12px; }
        input { width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: 2px; font-size: 13px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--blue); }
        .res-box { background: var(--bg); padding: 12px; border: 1px solid #e2e8f0; margin-top: 10px; }
        .res-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
        .total-price { font-size: 20px; font-weight: 800; color: var(--blue); text-align: right; margin-top: 8px; border-top: 1px solid #e2e8f0; padding-top: 8px; }
        .btn-add { background: var(--blue); color: #fff; border: none; width: 100%; height: 40px; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 10px; font-size: 11px; }
        .btn-add:disabled { background: #cbd5e1; }
    </style>
</head>
<body>

<div class="input-group">
    <label>Выбранная позиция</label>
    <input type="text" id="itemName" readonly placeholder="Выберите товар в каталоге...">
</div>

<div class="input-group">
    <label id="unitLabel">Количество</label>
    <input type="number" id="qty" value="1" min="1" oninput="calculate()">
</div>

<div class="res-box">
    <div class="res-row"><span>Вес ед.:</span> <b id="wU">0.000</b> кг</div>
    <div class="res-row"><span>Общий вес:</span> <b id="wT">0.000</b> кг</div>
    <div class="total-price"><span id="pT">0</span> ₽</div>
</div>

<button id="addBtn" class="btn-add" onclick="sendData()" disabled>Добавить в расчет</button>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSYKUmtE5Idl6Jb5Le2Xrus-AV-9gdcDPHckyejXN4WKrfdR7qsMQmdv7mDoxXYVfwdFKQfBBTBeLsa/pub?output=csv';
    let db = [];
    let current = null;

    // Загрузка данных
    async function init() {
        const r = await fetch(CSV_URL);
        const t = await r.text();
        db = t.split('\n').slice(1).map(line => {
            const p = line.split(',');
            return {
                name: p[1]?.trim(),
                weight: parseFloat(p[2]),
                unit: p[3]?.trim(),
                price: parseFloat(p[4])
            };
        }).filter(i => i.name);
    }

    // Слушаем команды от основного сайта
    window.addEventListener('message', function(e) {
        if (e.data.type === 'SET_BY_INDEX') {
            const item = db[e.data.index];
            if (item) {
                current = item;
                document.getElementById('itemName').value = item.name;
                document.getElementById('unitLabel').innerText = "Количество (" + item.unit + ")";
                document.getElementById('addBtn').disabled = false;
                calculate();
            }
        }
    });

    function calculate() {
        if (!current) return;
        const q = parseFloat(document.getElementById('qty').value) || 0;
        document.getElementById('wU').innerText = current.weight.toFixed(3);
        document.getElementById('wT').innerText = (current.weight * q).toFixed(3);
        document.getElementById('pT').innerText = (current.price * q).toLocaleString();
    }

    function sendData() {
        const q = document.getElementById('qty').value;
        const p = parseInt(document.getElementById('pT').innerText.replace(/\s/g, ''));
        window.parent.postMessage({
            type: 'ADD_TO_CART',
            name: current.name,
            qty: q,
            price: p
        }, '*');
    }

    init();
</script>
</body>
</html>
