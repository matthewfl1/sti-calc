<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ООО СТРОЙТЕХИНВЕСТ | Панель управления</title>
    <style>
        :root { --blue: #004a99; --text: #1e293b; --bg: #f1f5f9; --border: #cbd5e1; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; color: var(--text); }
        header { background: #fff; border-bottom: 1px solid var(--border); padding: 15px 5%; display: flex; justify-content: space-between; }
        .logo { font-size: 20px; font-weight: 800; color: var(--blue); }
        .container { display: grid; grid-template-columns: 1fr 380px; gap: 24px; padding: 24px 5%; max-width: 1400px; margin: auto; }
        h2 { font-size: 16px; text-transform: uppercase; color: #475569; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .card { background: #fff; padding: 16px; border: 1px solid var(--border); border-radius: 2px; }
        .card h4 { margin: 0 0 8px; font-size: 14px; }
        .card p { font-size: 12px; color: #64748b; margin-bottom: 12px; }
        .btn-pick { width: 100%; padding: 8px; background: #fff; border: 1px solid var(--blue); color: var(--blue); font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .btn-pick:hover { background: var(--blue); color: #fff; }
        .sidebar { position: sticky; top: 20px; }
        iframe { width: 100%; height: 380px; border: none; background: transparent; }
        .order-summary { background: #fff; border: 1px solid var(--border); padding: 20px; margin-top: 16px; }
        .order-item { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; border-bottom: 1px solid #f1f5f9; }
        .final-price { font-size: 24px; font-weight: 800; color: var(--blue); margin-top: 15px; text-align: right; }
    </style>
</head>
<body>
    <header><div class="logo">СТРОЙТЕХИНВЕСТ</div></header>

    <div class="container">
        <main>
            <h2>Каталог продукции</h2>
            <div class="grid">
                <div class="card">
                    <h4>Сетка сварная 50х50х3</h4>
                    <p>ГОСТ 23279. Вес: 1.85 кг/к.</p>
                    <button class="btn-pick" onclick="pick(0)">Выбрать</button>
                </div>
                <div class="card">
                    <h4>Сетка сварная 100х100х4</h4>
                    <p>ГОСТ 23279. Вес: 4.80 кг/к.</p>
                    <button class="btn-pick" onclick="pick(2)">Выбрать</button>
                </div>
                <div class="card">
                    <h4>Проволока 3.0 ВР-1</h4>
                    <p>ГОСТ 6727. Вес: 100.00 кг/м.</p>
                    <button class="btn-pick" onclick="pick(15)">Выбрать</button>
                </div>
                <div class="card">
                    <h4>Болт М16х60</h4>
                    <p>ГОСТ 22353. Вес: 0.138 кг/шт.</p>
                    <button class="btn-pick" onclick="pick(19)">Выбрать</button>
                </div>
            </div>
        </main>

        <aside class="sidebar">
            <iframe id="calcFrame" src="widget.html"></iframe>
            
            <div class="order-summary">
                <div style="font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 10px;">ИТОГОВЫЙ РАСЧЕТ:</div>
                <div id="orderList"></div>
                <div class="final-price"><span id="totalSum">0</span> ₽</div>
            </div>
        </aside>
    </div>

    <script>
        let total = 0;
        // Функция отправки индекса в iframe
        function pick(idx) {
            const frame = document.getElementById('calcFrame');
            frame.contentWindow.postMessage({ type: 'SET_BY_INDEX', index: idx }, '*');
        }

        // Слушаем ответ от калькулятора при нажатии "Добавить"
        window.addEventListener('message', function(e) {
            if (e.data.type === 'ADD_TO_CART') {
                const list = document.getElementById('orderList');
                const item = document.createElement('div');
                item.className = 'order-item';
                item.innerHTML = `<span>${e.data.name} (x${e.data.qty})</span><b>${e.data.price.toLocaleString()} ₽</b>`;
                list.appendChild(item);
                
                total += e.data.price;
                document.getElementById('totalSum').innerText = total.toLocaleString();
            }
        });
    </script>
</body>
</html>
